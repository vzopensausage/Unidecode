name: Microsoft Store Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example v0.1.0"
        required: true
        default: "v0.1.0"

permissions:
  contents: read

concurrency:
  group: microsoft-store-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || vars.STORE_AUTO_PUBLISH == 'true'
    runs-on: windows-latest
    environment: microsoft-store
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
      STORE_PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
      STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
      STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
      STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
      AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
      AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
      AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
      SELLER_ID: ${{ secrets.SELLER_ID }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: microsoft/setup-msbuild@v2

      - name: Validate Store configuration
        shell: pwsh
        run: |
          $required = @(
            "STORE_PRODUCT_ID",
            "STORE_IDENTITY_NAME",
            "STORE_PUBLISHER",
            "STORE_PUBLISHER_DISPLAY_NAME",
            "AZURE_AD_APPLICATION_CLIENT_ID",
            "AZURE_AD_APPLICATION_SECRET",
            "AZURE_AD_TENANT_ID",
            "SELLER_ID"
          )
          $missing = $required | Where-Object {
            [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
          }
          if ($missing.Count -gt 0) {
            throw "Missing GitHub Store configuration: $($missing -join ', ')"
          }

      - name: Run decoder tests
        run: dotnet run --project tests/Unidecode.Core.Tests/Unidecode.Core.Tests.csproj --configuration Release

      - name: Apply Store identity and version
        shell: pwsh
        run: |
          ./scripts/GenerateAssets.ps1
          ./scripts/Set-PackageVersion.ps1 -Tag $env:RELEASE_VERSION
          $identityParameters = @{
            IdentityName = $env:STORE_IDENTITY_NAME
            Publisher = $env:STORE_PUBLISHER
            PublisherDisplayName = $env:STORE_PUBLISHER_DISPLAY_NAME
          }
          ./scripts/Set-StoreIdentity.ps1 @identityParameters

      - name: Build unsigned x64 Store MSIX
        shell: pwsh
        run: >-
          msbuild src/Unidecode/Unidecode.csproj
          /restore
          /m
          /p:Configuration=Release
          /p:Platform=x64
          /p:RuntimeIdentifier=win-x64
          /p:GenerateAppxPackageOnBuild=true
          /p:AppxPackageSigningEnabled=false
          /p:AppxBundle=Never
          /p:UapAppxPackageBuildMode=StoreUpload
          /p:AppxPackageDir=${{ github.workspace }}\store-artifacts\x64\

      - name: Build unsigned ARM64 Store MSIX
        shell: pwsh
        run: >-
          msbuild src/Unidecode/Unidecode.csproj
          /restore
          /m
          /p:Configuration=Release
          /p:Platform=ARM64
          /p:RuntimeIdentifier=win-arm64
          /p:GenerateAppxPackageOnBuild=true
          /p:AppxPackageSigningEnabled=false
          /p:AppxBundle=Never
          /p:UapAppxPackageBuildMode=StoreUpload
          /p:AppxPackageDir=${{ github.workspace }}\store-artifacts\ARM64\

      - name: Create x64 and ARM64 Store bundle
        shell: pwsh
        run: >-
          ./scripts/New-StoreBundle.ps1
          -PackagesRoot "${{ github.workspace }}\store-artifacts"
          -OutputPath "${{ github.workspace }}\store-upload\Unidecode.msixbundle"

      - name: Upload Store bundle as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unidecode-Store-${{ env.RELEASE_VERSION }}
          path: store-upload/Unidecode.msixbundle
          if-no-files-found: error

      - name: Setup Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Authenticate with Partner Center
        shell: pwsh
        run: >-
          msstore reconfigure
          --tenantId "$env:AZURE_AD_TENANT_ID"
          --sellerId "$env:SELLER_ID"
          --clientId "$env:AZURE_AD_APPLICATION_CLIENT_ID"
          --clientSecret "$env:AZURE_AD_APPLICATION_SECRET"

      - name: Publish update to Microsoft Store
        shell: pwsh
        run: >-
          msstore publish
          "${{ github.workspace }}\store-upload\Unidecode.msixbundle"
          --id "$env:STORE_PRODUCT_ID"
