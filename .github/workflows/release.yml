name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to build, for example v0.1.0"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: microsoft/setup-msbuild@v2
      - name: Run decoder tests
        run: dotnet run --project tests/Unidecode.Core.Tests/Unidecode.Core.Tests.csproj --configuration Release
      - name: Generate assets and set package version
        shell: pwsh
        run: |
          ./scripts/GenerateAssets.ps1
          ./scripts/Set-PackageVersion.ps1 -Tag $env:RELEASE_TAG
      - name: Create release signing certificate
        id: certificate
        shell: pwsh
        run: |
          $passwordText = [Guid]::NewGuid().ToString("N")
          $password = ConvertTo-SecureString $passwordText -AsPlainText -Force
          $certificateParameters = @{
            Type = "Custom"
            Subject = "CN=Unidecode"
            KeyUsage = "DigitalSignature"
            FriendlyName = "Unidecode GitHub Release"
            CertStoreLocation = "Cert:\CurrentUser\My"
            TextExtension = @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          }
          $certificate = New-SelfSignedCertificate @certificateParameters
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Export-PfxCertificate -Cert $certificate -FilePath artifacts/Unidecode.pfx -Password $password | Out-Null
          Export-Certificate -Cert $certificate -FilePath artifacts/Unidecode.cer | Out-Null
          Write-Output "::add-mask::$passwordText"
          "password=$passwordText" >> $env:GITHUB_OUTPUT
      - name: Build signed x64 MSIX
        shell: pwsh
        run: >-
          msbuild src/Unidecode/Unidecode.csproj
          /restore
          /m
          /p:Configuration=Release
          /p:Platform=x64
          /p:RuntimeIdentifier=win-x64
          /p:GenerateAppxPackageOnBuild=true
          /p:AppxPackageSigningEnabled=true
          /p:PackageCertificateKeyFile=${{ github.workspace }}\artifacts\Unidecode.pfx
          /p:PackageCertificatePassword=${{ steps.certificate.outputs.password }}
          /p:AppxBundle=Never
          /p:UapAppxPackageBuildMode=SideloadOnly
          /p:AppxPackageDir=${{ github.workspace }}\artifacts\x64\
      - name: Build signed ARM64 MSIX
        shell: pwsh
        run: >-
          msbuild src/Unidecode/Unidecode.csproj
          /restore
          /m
          /p:Configuration=Release
          /p:Platform=ARM64
          /p:RuntimeIdentifier=win-arm64
          /p:GenerateAppxPackageOnBuild=true
          /p:AppxPackageSigningEnabled=true
          /p:PackageCertificateKeyFile=${{ github.workspace }}\artifacts\Unidecode.pfx
          /p:PackageCertificatePassword=${{ steps.certificate.outputs.password }}
          /p:AppxBundle=Never
          /p:UapAppxPackageBuildMode=SideloadOnly
          /p:AppxPackageDir=${{ github.workspace }}\artifacts\ARM64\
      - name: Prepare release files
        shell: pwsh
        run: |
          Remove-Item artifacts/Unidecode.pfx -Force
          Copy-Item scripts/Install.ps1 artifacts/Install.ps1
          Get-ChildItem artifacts -Recurse -File | Select-Object FullName, Length
      - name: Upload release files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(
            (Get-ChildItem artifacts -Recurse -Filter "*.msix" | ForEach-Object { $_.FullName })
            (Resolve-Path artifacts/Unidecode.cer).Path
            (Resolve-Path artifacts/Install.ps1).Path
          )
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            gh release create $env:RELEASE_TAG $files --generate-notes --title "Unidecode $env:RELEASE_TAG" --target $env:GITHUB_SHA
          }
          else {
            gh release create $env:RELEASE_TAG $files --generate-notes --title "Unidecode $env:RELEASE_TAG"
          }
